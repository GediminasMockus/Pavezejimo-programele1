name: Unread notification email reminders

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger unread reminder check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Skipping reminder check: repository secret CRON_SECRET is not configured."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pavezejimo-programele1.vercel.app/api/cron/unread-reminders"
