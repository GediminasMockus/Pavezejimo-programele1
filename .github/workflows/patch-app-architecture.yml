name: One-time App architecture patch

on:
  push:
    branches: ['mvp-hardening-v2']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix App architecture') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-hardening-v2

      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          s = s.replace(
              "supabase.from('user_profiles').select('is_admin').eq('id', userId).maybeSingle()\n      .then(({ data }) => setIsAdmin(data?.is_admin === true));",
              "supabase.rpc('get_my_profile_flags')\n      .then(({ data }) => setIsAdmin(data?.[0]?.is_admin === true));"
          )

          old = """      const { data, error } = await withRetry(\n        () => supabase\n          .from('trips')\n          .select('*')\n          .is('deleted_at', null)\n          .order('departure_time', { ascending: true }),\n        { maxRetries: 2, delay: 1000, onRetry: (err, attempt) => console.log(`Retry ${attempt} for loadTrips:`, err.message) }\n      );\n      if (error) {\n        setError('Nepavyko įkelti skelbimų. Bandykite vėliau.');\n      } else {\n        setTrips(data ?? []);\n      }"""
          new = """      const [publicResult, ownResult] = await Promise.all([\n        withRetry(\n          () => supabase\n            .from('public_trips')\n            .select('*')\n            .order('departure_time', { ascending: true }),\n          { maxRetries: 2, delay: 1000, onRetry: (err, attempt) => console.log(`Retry ${attempt} for public trips:`, err.message) }\n        ),\n        withRetry(\n          () => supabase.rpc('get_my_trips'),\n          { maxRetries: 2, delay: 1000, onRetry: (err, attempt) => console.log(`Retry ${attempt} for own trips:`, err.message) }\n        ),\n      ]);\n      if (publicResult.error || ownResult.error) {\n        setError('Nepavyko įkelti skelbimų. Bandykite vėliau.');\n      } else {\n        const merged = new Map<string, Trip>();\n        for (const trip of publicResult.data ?? []) merged.set(trip.id, trip as Trip);\n        for (const trip of ownResult.data ?? []) merged.set(trip.id, trip as Trip);\n        setTrips([...merged.values()].sort((a, b) => new Date(a.departure_time).getTime() - new Date(b.departure_time).getTime()));\n      }"""
          if old not in s:
              raise SystemExit('loadTrips target not found')
          s = s.replace(old, new)

          s = s.replace(
              ".select('*')\n      .in('id', userIds);",
              ".select('id,display_name,total_ratings,avg_rating,default_role,created_at')\n      .in('id', userIds);"
          )

          s = s.replace(
              "() => applyFilters(otherTrips, filters, userLocation?.lat, userLocation?.lng).sort((a, b) => new Date(a.departure_time).getTime() - new Date(b.departure_time).getTime()),\n    [otherTrips, filters, userLocation],",
              "() => applyFilters(otherTrips, filters, userPos?.lat, userPos?.lng).sort((a, b) => new Date(a.departure_time).getTime() - new Date(b.departure_time).getTime()),\n    [otherTrips, filters, userPos],"
          )

          s = s.replace(
              "    const latestOwnTrip = ownTrips[0];\n    return findBestMatches(latestOwnTrip, otherTrips, 3);",
              "    const nextOwnTrip = [...ownTrips]\n      .filter((t) => t.status === 'active' && new Date(t.departure_time).getTime() >= now)\n      .sort((a, b) => new Date(a.departure_time).getTime() - new Date(b.departure_time).getTime())[0];\n    if (!nextOwnTrip) return [];\n    return findBestMatches(nextOwnTrip, otherTrips, 3);"
          )

          old_rating = """              const ratedId = profileTarget.userId;\n              const rateRole: TripRole = profileTarget.trip.role === 'driver' ? 'driver' : 'passenger';\n              const { error: ratingError } = await supabase.rpc('submit_rating', {\n                p_trip_id: profileTarget.trip.id,\n                p_rated_id: ratedId,\n                p_role: rateRole,\n                p_score: score,\n                p_comment: comment ?? null,\n              });"""
          new_rating = """              const ratedId = profileTarget.userId;\n              const rateRole: TripRole = profileTarget.trip.role === 'driver' ? 'driver' : 'passenger';\n              const ratingRequest = allRequests.find((r) =>\n                r.status === 'accepted' &&\n                ((r.trip_id === profileTarget.trip.id && (r.passenger_id === ratedId || r.passenger_id === clientId)) ||\n                 (r.driver_trip_id === profileTarget.trip.id && (r.driver_id === ratedId || r.driver_id === clientId)))\n              );\n              const { error: ratingError } = await supabase.rpc('submit_rating', {\n                p_trip_id: profileTarget.trip.id,\n                p_rated_id: ratedId,\n                p_role: rateRole,\n                p_score: score,\n                p_comment: comment ?? null,\n                p_request_id: ratingRequest?.id ?? null,\n              });"""
          if old_rating not in s:
              raise SystemExit('rating target not found')
          s = s.replace(old_rating, new_rating)

          p.write_text(s)
          PY

      - name: Commit App fix and remove one-time workflow
        run: |
          rm -f .github/workflows/patch-app-architecture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/patch-app-architecture.yml
          git diff --cached --quiet || git commit -m 'fix App architecture: privacy and geolocation wiring'
          git push origin mvp-hardening-v2
