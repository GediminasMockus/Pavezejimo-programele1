name: One-time Settings profile patch

on:
  push:
    branches: ['mvp-hardening-v2']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix Settings profile privacy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-hardening-v2
      - name: Patch SettingsModal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/SettingsModal.tsx')
          s = p.read_text()
          old = """    supabase\n      .from('user_profiles')\n      .select('*')\n      .eq('id', userId)\n      .maybeSingle()\n      .then(({ data }) => {\n        if (data) {\n          setProfile(data);\n          setDisplayName(data.display_name ?? '');\n          setPhone(data.phone ?? '');\n          setDefaultRole(data.default_role ?? '');\n        }\n        setLoading(false);\n      });"""
          new = """    supabase\n      .rpc('get_my_profile')\n      .then(({ data }) => {\n        const profileData = data?.[0];\n        if (profileData) {\n          setProfile(profileData);\n          setDisplayName(profileData.display_name ?? '');\n          setPhone(profileData.phone ?? '');\n          setDefaultRole(profileData.default_role ?? '');\n        }\n        setLoading(false);\n      });"""
          if old not in s:
              raise SystemExit('Settings profile read target not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/patch-settings-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SettingsModal.tsx .github/workflows/patch-settings-profile.yml
          git commit -m 'fix Settings profile privacy'
          git push origin mvp-hardening-v2
