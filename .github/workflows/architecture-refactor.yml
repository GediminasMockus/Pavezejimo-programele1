name: Architecture refactor

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/architecture-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/architecture-refactor.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/architecture-refactor.mjs .github/workflows/architecture-refactor.yml
          git add -A
          git commit -m "refactor: harden ride lifecycle and navigation"
          git push origin HEAD:master
