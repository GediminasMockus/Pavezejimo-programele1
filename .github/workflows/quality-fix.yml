name: Quality fix
on:
  push:
    branches: ['mvp-hardening-v2']
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-hardening-v2
          fetch-depth: 0
      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/AdminLogs.tsx')
          s = p.read_text()
          s = s.replace('handleToggleAdmin(p.id, p.is_admin)', 'handleToggleAdmin(p.id, p.is_admin ?? false)')
          p.write_text(s)

          p = Path('src/components/TripForm.tsx')
          s = p.read_text()
          old = """      const lastDriverTrip = (data ?? [])\n        .filter((trip) => trip.role === 'driver')\n        .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];"""
          new = """      const ownTrips = (data ?? []) as Trip[];\n      const lastDriverTrip = ownTrips\n        .filter((trip) => trip.role === 'driver')\n        .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];"""
          if old not in s:
              raise SystemExit('TripForm target not found')
          p.write_text(s.replace(old, new))

          p = Path('src/components/RoutePreviewModal.tsx')
          s = p.read_text()
          for name in ('pickup_lat', 'pickup_lng', 'dropoff_lat', 'dropoff_lng'):
              s = s.replace(f'request!.{name}', f'request!.{name}!')
          s = s.replace(', calculateDetour', '')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminLogs.tsx src/components/TripForm.tsx src/components/RoutePreviewModal.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve remaining typecheck errors'
          git push origin HEAD:mvp-hardening-v2
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/quality-fix.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove temporary quality fix workflow'
          git push origin HEAD:mvp-hardening-v2