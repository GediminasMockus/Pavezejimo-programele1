name: One-time TripForm privacy patch

on:
  push:
    branches: ['mvp-hardening-v2']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix TripForm privacy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-hardening-v2
      - name: Patch TripForm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/TripForm.tsx')
          s = p.read_text()
          old = """    supabase.from('user_profiles').select('display_name, phone').eq('id', userId).maybeSingle().then(({ data }) => {\n      if (data?.display_name) setName(data.display_name);\n      if (data?.phone) setPhone(data.phone);\n    });\n\n    // Load last driver trip car details for pre-filling\n    if (isDriver) {\n      supabase\n        .from('trips')\n        .select('car_make, car_color, car_plate')\n        .eq('created_by', userId)\n        .eq('role', 'driver')\n        .is('deleted_at', null)\n        .order('created_at', { ascending: false })\n        .limit(1)\n        .maybeSingle()\n        .then(({ data }) => {\n          if (data) {\n            if (data.car_make) setCarMake(data.car_make);\n            if (data.car_color) setCarColor(data.car_color);\n            if (data.car_plate) setCarPlate(data.car_plate);\n          }\n        });\n    }"""
          new = """    supabase.rpc('get_my_profile').then(({ data }) => {\n      const profileData = data?.[0];\n      if (profileData?.display_name) setName(profileData.display_name);\n      if (profileData?.phone) setPhone(profileData.phone);\n    });\n\n    // Load last own driver trip through the private owner RPC.\n    if (isDriver) {\n      supabase.rpc('get_my_trips').then(({ data }) => {\n        const lastDriverTrip = (data ?? [])\n          .filter((trip) => trip.role === 'driver')\n          .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];\n        if (lastDriverTrip) {\n          if (lastDriverTrip.car_make) setCarMake(lastDriverTrip.car_make);\n          if (lastDriverTrip.car_color) setCarColor(lastDriverTrip.car_color);\n          if (lastDriverTrip.car_plate) setCarPlate(lastDriverTrip.car_plate);\n        }\n      });\n    }"""
          if old not in s:
              raise SystemExit('TripForm privacy target not found')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/patch-tripform-privacy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TripForm.tsx .github/workflows/patch-tripform-privacy.yml
          git commit -m 'fix TripForm privacy'
          git push origin mvp-hardening-v2
