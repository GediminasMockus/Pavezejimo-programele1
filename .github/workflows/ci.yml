name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['master']

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  temporary-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'mvp-hardening-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-hardening-v2
          fetch-depth: 0
      - name: Apply cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text()
          marker = "  const [now, setNow] = useState(() => Date.now());"
          if "const [actionLoading, setActionLoading]" not in s:
              s = s.replace(marker, "  const [actionLoading, setActionLoading] = useState<string | null>(null);\n" + marker, 1)
          s = s.replace("} catch {\n      console.error('Failed to load requests:', err);", "} catch (err) {\n      console.error('Failed to load requests:', err);")
          p.write_text(s)

          p = Path('src/components/MapView.tsx')
          s = p.read_text().replace('        globalThis.userLocation = next;\n', '').replace('        globalThis.userLocation = null;\n', '')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/MapView.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove obsolete geolocation bridge'
          git push origin HEAD:mvp-hardening-v2