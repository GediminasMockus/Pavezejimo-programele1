name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['master']

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  temporary-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'mvp-hardening-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-hardening-v2
          fetch-depth: 0
      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/AdminLogs.tsx')
          s = p.read_text()
          s = s.replace('handleToggleAdmin(p.id, p.is_admin)', 'handleToggleAdmin(p.id, p.is_admin ?? false)')
          p.write_text(s)

          p = Path('src/components/TripForm.tsx')
          s = p.read_text()
          pattern = re.compile(r"const lastDriverTrip = \(data \?\? \[\]\)\s*\.filter\(\(trip\) => trip\.role === 'driver'\)\s*\.sort\(\(a, b\) => new Date\(b\.created_at\)\.getTime\(\) - new Date\(a\.created_at\)\.getTime\(\)\)\[0\];")
          replacement = "const ownTrips = (data ?? []) as Trip[];\n        const lastDriverTrip = ownTrips\n          .filter((trip) => trip.role === 'driver')\n          .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0];"
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('TripForm target not found')
          p.write_text(s)

          p = Path('src/components/RoutePreviewModal.tsx')
          s = p.read_text()
          for name in ('pickup_lat', 'pickup_lng', 'dropoff_lat', 'dropoff_lng'):
              s = s.replace(f'request!.{name}', f'request!.{name}!')
          s = s.replace(', calculateDetour', '')
          p.write_text(s)
          PY
      - name: Commit source fixes and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quality-fix.yml || true
          git add src/components/AdminLogs.tsx src/components/TripForm.tsx src/components/RoutePreviewModal.tsx .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve remaining typecheck errors'
          git push origin HEAD:mvp-hardening-v2